<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מתכנן ארוחות חכם</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="header-controls">
        <h1>מתכנן ארוחות חכם 🍽️</h1>
        <div>
            <button id="theme-toggle" class="icon-btn">🌙</button>
            <button id="logout-btn" class="icon-btn hidden" onclick="logout()" title="התנתק">🚪</button>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="card">
        <h2>כניסת מנהל</h2>
        <p class="text-muted">האפליקציה חסומה. אנא התחבר כדי להמשיך.</p>
        <input type="email" id="login-email" placeholder="אימייל">
        <input type="password" id="login-password" placeholder="סיסמה">
        <button onclick="login()">התחבר</button>
        <p id="login-error" class="error-text"></p>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="main-app" class="hidden">
        
        <!-- Randomizer Section -->
        <div class="card">
            <h2>הגרלת ארוחות</h2>

            <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; align-items: flex-end;">
                <div>
                    <label for="servings-multiplier" style="display: block; font-size: 0.9em; margin-bottom: 4px;">מכפיל מנות/כמות:</label>
                    <input type="number" id="servings-multiplier" value="1" min="0.1" step="any" oninput="renderSelectedMealsAndList()" style="width: 100px; padding: 6px; border-radius: 4px; border: 1px solid var(--border-color, #ccc);">
                </div>

                <div style="flex-grow: 1; min-width: 220px;">
                    <label for="pantry-filter" style="display: block; font-size: 0.9em; margin-bottom: 4px;">יש בבית (סנן לפי מצרכים):</label>
                    <input type="text" id="pantry-filter" placeholder="לדוגמה: עוף, אורז (מופרד בפסיקים)" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid var(--border-color, #ccc);">
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                <button onclick="randomizeMeals(1)">הגרל ארוחה 1</button>
                <button onclick="randomizeMeals(3)">הגרל 3 ארוחות</button>
                <button onclick="randomizeMeals(5)">הגרל 5 ארוחות</button>
            </div>
            
            <div id="results"></div>

            <div id="shopping-list-section" class="hidden" style="margin-top: 20px; padding: 20px; background: var(--bg-color); border-radius: 8px; border: 1px dashed var(--border-color);">
                <h3 style="margin-top:0;">🛒 רשימת קניות מסודרת לפי קטגוריות:</h3>
                <div id="shopping-list-container"></div>
                
                <div class="shopping-actions" style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button onclick="shareToWhatsApp()" class="whatsapp-btn" style="background-color: #25D366; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer;">📱 שלח ל-WhatsApp</button>
                    <button onclick="copyShoppingList()" class="copy-btn" style="padding: 8px 14px; border-radius: 4px; cursor: pointer;">📋 העתק לרשימה</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 id="form-title">הוספת מתכון חדש</h2>
            <input type="hidden" id="meal-id">
            
            <label>שם הארוחה:</label>
            <input type="text" id="meal-name" placeholder="לדוגמה: פסטה ברוטב עגבניות">
            
            <label>מצרכים (כל מצרך בשורה נפרדת):</label>
            <textarea id="meal-ingredients" rows="4" placeholder="עגבניות&#10;פסטה&#10;שום"></textarea>
            
            <label>הוראות הכנה:</label>
            <textarea id="meal-instructions" rows="4" placeholder="1. הרתיחו מים..."></textarea>
            
            <label>תמונת הארוחה (העלאת קובץ):</label>
            <input type="file" id="meal-image-file" accept="image/*">
            <input type="hidden" id="meal-image-url">
            
            <button id="save-btn" onclick="saveMeal()">שמור ארוחה</button>
            <button id="cancel-btn" class="cancel-btn hidden" onclick="resetForm()">ביטול עריכה</button>
        </div>

        <div class="card">
            <h2>ספריית ארוחות</h2>
            <div id="meals-library"></div>
        </div>

    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>

<!-- Main Logic -->
<script src="app.js"></script>
</body>
</html>
