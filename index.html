<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מתכנן ארוחות חכם</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="header-controls">
        <h1>מתכנן ארוחות חכם 🍽️</h1>
        <div>
            <button id="theme-toggle" class="icon-btn">🌙</button>
            <button id="logout-btn" class="icon-btn hidden" onclick="logout()" title="התנתק">🚪</button>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="card">
        <h2>כניסת מנהל</h2>
        <input type="email" id="login-email" placeholder="אימייל">
        <input type="password" id="login-password" placeholder="סיסמה">
        <button onclick="login()">התחבר</button>
        <p id="login-error" class="error-text"></p>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="main-app" class="hidden">
        
        <!-- OFFICIAL PLANNER SECTION -->
        <div class="card" style="border: 2px solid var(--primary, #007bff);">
            <h2>📅 התוכנית הרשמית שלי</h2>
            
            <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; align-items: flex-end;">
                <div>
                    <label style="display: block; font-size: 0.9em; margin-bottom: 4px;">מספר ארוחות לתוכנית:</label>
                    <input type="number" id="plan-count" value="3" min="1" style="width: 80px; padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                </div>
                <div style="flex-grow: 1;">
                    <label style="display: block; font-size: 0.9em; margin-bottom: 4px;">סנן לפי מצרכים (אופציונלי):</label>
                    <input type="text" id="plan-filter" placeholder="לדוגמה: עוף, תפוחי אדמה" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                </div>
            </div>

            <button onclick="generateOfficialPlan()" style="background-color: var(--primary, #007bff); color: white; width: 100%; margin-bottom: 15px;">צור תוכנית חדשה 🎲</button>
            
            <div id="official-plan-results"></div>

            <button id="finish-week-btn" onclick="finishPlan()" class="hidden" style="background-color: #28a745; margin-top: 15px; width: 100%;">✅ סיום שבוע - העבר ליומן</button>
        </div>

        <!-- SHOPPING LIST SECTION -->
        <div class="card">
            <h2>🛒 רשימת קניות (לפי התוכנית הרשמית)</h2>
            <label style="display: block; font-size: 0.9em; margin-bottom: 4px;">מכפיל כמות למצרכים:</label>
            <input type="number" id="servings-multiplier" value="1" min="0.1" step="any" oninput="renderShoppingList()" style="width: 100px; padding: 6px; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 15px;">
            
            <div id="shopping-list-container"></div>
            
            <div class="shopping-actions" style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button onclick="shareToWhatsApp()" style="background-color: #25D366; color: white;">📱 שלח ל-WhatsApp</button>
                <button onclick="copyShoppingList()">📋 העתק לרשימה</button>
            </div>
        </div>

        <!-- SANDBOX / INSPIRATION SECTION -->
        <div class="card">
            <h2>💡 ארגז חול (הגרלה להשראה בלבד)</h2>
            <p class="text-muted" style="font-size: 0.85em;">הגרלות כאן אינן משפיעות על הסקורבורד ואינן נשמרות.</p>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button onclick="randomizeSandbox(1)">הגרל 1</button>
                <button onclick="randomizeSandbox(3)">הגרל 3</button>
            </div>
            <div id="sandbox-results"></div>
        </div>

        <!-- ADD/EDIT RECIPE SECTION -->
        <div class="card">
            <h2 id="form-title">הוספת מתכון חדש</h2>
            <input type="hidden" id="meal-id">
            <label>שם הארוחה:</label>
            <input type="text" id="meal-name" placeholder="לדוגמה: פסטה ברוטב עגבניות">
            <label>מצרכים (כל מצרך בשורה נפרדת):</label>
            <textarea id="meal-ingredients" rows="4"></textarea>
            <label>הוראות הכנה:</label>
            <textarea id="meal-instructions" rows="4"></textarea>
            <label>תמונת הארוחה (URL או העלאה):</label>
            <input type="file" id="meal-image-file" accept="image/*">
            <input type="hidden" id="meal-image-url">
            
            <button id="save-btn" onclick="saveMeal()">שמור ארוחה</button>
            <button id="cancel-btn" class="cancel-btn hidden" onclick="resetForm()">ביטול עריכה</button>
        </div>

        <div class="card">
            <h2>ספריית ארוחות</h2>
            <div id="meals-library"></div>
        </div>

    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<!-- Our Modular Logic -->
<script src="js/firebase-core.js"></script>
<script src="js/parser.js"></script>
<script src="js/planner.js"></script>
<script src="js/ui.js"></script>

</body>
</html>
