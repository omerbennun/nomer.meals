<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מתכנן ארוחות חכם</title>
    <style>
        /* Modern CSS Variables for Light/Dark Mode */
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #e2e8f0;
            --danger: #ef4444;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h1, h2 { color: var(--text-main); margin-top: 0; }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px 0;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }
        .danger-btn { background-color: var(--danger); }
        
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .icon-btn {
            background: none;
            color: var(--text-main);
            font-size: 24px;
            padding: 8px;
        }
        .icon-btn:hover { background: var(--border-color); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-controls">
        <h1>מתכנן ארוחות חכם 🍽️</h1>
        <div>
            <button id="theme-toggle" class="icon-btn">🌙</button>
            <button id="logout-btn" class="icon-btn hidden" onclick="logout()" title="התנתק">🚪</button>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="card">
        <h2>כניסת מנהל</h2>
        <p style="color: var(--text-muted)">האפליקציה חסומה. אנא התחבר כדי להמשיך.</p>
        <input type="email" id="login-email" placeholder="אימייל">
        <input type="password" id="login-password" placeholder="סיסמה">
        <button onclick="login()">התחבר</button>
        <p id="login-error" style="color: var(--danger); margin-top: 10px;"></p>
    </div>

    <!-- MAIN APP SCREEN (Hidden until logged in) -->
    <div id="main-app" class="hidden">
        
        <div class="card">
            <h2>הגרלת ארוחות</h2>
            <p style="color: var(--text-muted)">* פילטרים יתווספו בשלב 5</p>
            <button>הגרל ארוחה</button>
            <div id="results"></div>
        </div>

        <div class="card">
            <h2>ניהול מתכונים</h2>
            <p style="color: var(--text-muted)">* הפרדת רכיבים ועריכה יתווספו בשלב 2</p>
            <!-- Placeholder for Phase 2 Form -->
        </div>

    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyDY1dl97i0-Des1CmHCb9wNA8jpmAIuNac",
      authDomain: "mymeals-f5dc0.firebaseapp.com",
      databaseURL: "https://mymeals-f5dc0-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mymeals-f5dc0",
      storageBucket: "mymeals-f5dc0.firebasestorage.app",
      messagingSenderId: "533677624737",
      appId: "1:533677624737:web:8821f04f8aa2a1a6998fe0",
      measurementId: "G-1Y8SZCZ4GE"
    };
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // --- DARK MODE LOGIC ---
    const themeToggle = document.getElementById('theme-toggle');
    
    // Check saved theme or system preference
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.setAttribute('data-theme', 'dark');
        themeToggle.innerText = '☀️';
    }

    themeToggle.addEventListener('click', () => {
        if (document.body.getAttribute('data-theme') === 'dark') {
            document.body.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            themeToggle.innerText = '🌙';
        } else {
            document.body.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            themeToggle.innerText = '☀️';
        }
    });

    // --- AUTHENTICATION LOGIC ---
    const loginScreen = document.getElementById('login-screen');
    const mainApp = document.getElementById('main-app');
    const logoutBtn = document.getElementById('logout-btn');
    const errorMsg = document.getElementById('login-error');

    // Watch for login state changes
    auth.onAuthStateChanged((user) => {
        if (user) {
            // User is signed in
            loginScreen.classList.add('hidden');
            mainApp.classList.remove('hidden');
            logoutBtn.classList.remove('hidden');
        } else {
            // User is signed out
            loginScreen.classList.remove('hidden');
            mainApp.classList.add('hidden');
            logoutBtn.classList.add('hidden');
        }
    });

    function login() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;
        errorMsg.innerText = '';

        auth.signInWithEmailAndPassword(email, pass)
            .catch((error) => {
                errorMsg.innerText = "שגיאה בהתחברות. ודא שאימייל והסיסמה נכונים.";
                console.error(error);
            });
    }

    function logout() {
        auth.signOut();
    }
</script>
</body>
</html>
